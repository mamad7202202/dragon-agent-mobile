name: dragon_agent_mobile
description: >-
  Dragon Agent Mobile — a fast, open-source AI agent for Android & iOS with a
  hybrid memory system. Bring your own key. Own your data.
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  uuid: ^4.5.1
  flutter_markdown: ^0.7.4+3
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0
  permission_handler: ^11.3.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
